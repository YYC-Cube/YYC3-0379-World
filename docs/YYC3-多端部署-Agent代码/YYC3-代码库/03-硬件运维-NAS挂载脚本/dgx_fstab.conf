# ==============================================================
# YYC³ AI FAmily DGX 端 /etc/fstab 开机自动挂载配置
# 两台 DGX 统一挂载路径；NAS源：10.0.0.10（RAID1+RAID6混合阵列）
# 部署：追加至 /etc/fstab 后执行 mount -a 验证
# ==============================================================

# 1. 核心配置区（只读）
10.0.0.10:/volume1/RAID1/yyc3-core          /mnt/nas/raid1-core     nfs4 ro,hard,intr,timeo=100,_netdev 0 0

# 2. NIM模型仓库（只读，大文件读优化）
10.0.0.10:/volume2/RAID6/yyc3-data/nim-model-repo  /mnt/nas/raid6-models  nfs4 ro,hard,intr,timeo=100,rsize=1048576,_netdev 0 0

# 3. 审计日志区（读写，DGX实时写入）
10.0.0.10:/volume1/RAID1/yyc3-core/audit-logs  /mnt/nas/raid1-logs  nfs4 rw,hard,intr,timeo=100,_netdev 0 0

# 4. 原始知识库素材（只读）
10.0.0.10:/volume2/RAID6/yyc3-data/knowledge-raw  /mnt/nas/raid6-knowledge  nfs4 ro,hard,intr,timeo=100,_netdev 0 0

# ======================== 部署步骤 =========================
# sudo mkdir -p /mnt/nas/{raid1-core,raid6-models,raid1-logs,raid6-knowledge}
# 编辑 /etc/fstab 追加上述内容 → sudo mount -a → df -h 验证
# ============================================================

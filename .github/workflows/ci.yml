name: YYC3 CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  # 允许手动触发
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ==================== 代码质量检查 ====================
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy isort
          pip install -r requirements.txt

      - run: black --check --line-length=100 core/
      - run: isort --check-only --diff --profile black core/
      - run: flake8 core/ --max-line-length=100 --exclude=__pycache__,migrations --ignore=E402,W503
      - name: mypy 类型检查（advisory，不阻塞）
        run: mypy core/ --ignore-missing-imports || true

  # ==================== 单元测试 ====================
  test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: yyc3_gpt_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio

      - name: 运行单元测试
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: test_password
          DB_NAME: yyc3_gpt_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          AUTH_ENABLED: "false"
        run: pytest tests/ -v --cov=core --cov-report=xml --cov-report=term-missing --tb=short

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ==================== 安全检查 ====================
  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: 安装安全工具
        run: |
          python -m pip install --upgrade pip
          pip install safety bandit
          pip install -r requirements.txt

      - name: Safety 依赖漏洞扫描
        run: safety check --file requirements.txt --json
        continue-on-error: true

      - name: Bandit 代码安全扫描
        run: bandit -r core/ -f json -o bandit-report.json || true

      - name: 上传安全报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: bandit-report.json

  # ==================== 构建镜像（仅 main 分支，Docker Hub 可选） ====================
  build:
    name: 构建镜像
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      HAS_DOCKER_HUB: ${{ secrets.DOCKER_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub 登录
        if: env.HAS_DOCKER_HUB == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 提取镜像标签
        if: env.HAS_DOCKER_HUB == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/yyc3-api
          tags: |
            type=sha,prefix=
            type=ref,event=branch

      - name: 构建并推送镜像
        if: env.HAS_DOCKER_HUB == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 仅构建镜像（无推送）
        if: env.HAS_DOCKER_HUB != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署到生产环境（NAS 网关） ====================
  deploy:
    name: 部署生产环境
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 检查必需的 GitHub Secrets
        run: |
          MISSING=""
          [ -z "${{ secrets.NAS_HOST }}" ] && MISSING="$MISSING NAS_HOST"
          [ -z "${{ secrets.NAS_USER }}" ] && MISSING="$MISSING NAS_USER"
          [ -z "${{ secrets.NAS_SSH_KEY }}" ] && MISSING="$MISSING NAS_SSH_KEY"
          if [ -n "$MISSING" ]; then
            echo "ERROR: 缺少必需的 GitHub Secrets:$MISSING"
            echo "请在 Settings > Secrets and variables > Actions 中配置"
            exit 1
          fi
          echo "All required secrets present"

      - name: 检查 NAS .env 中的必需变量
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          script: |
            ENV_FILE="/Volume2/yyc3-33/.env"
            if [ ! -f "$ENV_FILE" ]; then
              echo "ERROR: $ENV_FILE 不存在"
              exit 1
            fi
            MISSING=""
            for var in POSTGRES_PASSWORD REDIS_PASSWORD JWT_SECRET_KEY API_KEYS ZHIPU_API_KEY; do
              if ! grep -q "${var}=" "$ENV_FILE" 2>/dev/null; then
                MISSING="$MISSING $var"
              elif grep -q "${var}=\$" "$ENV_FILE" 2>/dev/null; then
                MISSING="$MISSING ${var}(empty)"
              elif grep -q "${var}=change_me" "$ENV_FILE" 2>/dev/null; then
                MISSING="$MISSING ${var}(default)"
              fi
            done
            if [ -n "$MISSING" ]; then
              echo "ERROR: NAS .env 缺少或未配置:$MISSING"
              exit 1
            fi
            echo "NAS .env 检查通过"

      - name: 拉取代码并重建 Gateway
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.NAS_SSH_KEY }}
          script: |
            cd /Volume2/yyc3-33 && git pull origin main
            docker compose up -d --build gateway
            echo "Gateway 重建完成"

      - name: 全链路健康验证
        run: |
          echo "等待服务启动..."
          sleep 20
          ENDPOINTS=(
            "https://api.0379.world/healthz"
            "https://api.0379.world/v1/ping"
            "https://api.0379.world/health"
          )
          PASS=0
          FAIL=0
          for ep in "${ENDPOINTS[@]}"; do
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "$ep" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "PASS  $ep [$STATUS]"
              PASS=$((PASS + 1))
            else
              echo "FAIL  $ep [$STATUS]"
              FAIL=$((FAIL + 1))
            fi
          done
          echo ""
          echo "结果: $PASS 通过, $FAIL 失败"
          [ "$FAIL" -eq 0 ] || exit 1

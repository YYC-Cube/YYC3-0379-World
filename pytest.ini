[pytest]
# pytest 配置文件

# 测试路径
testpaths = tests

# Python 文件和类的命名模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行参数
# 分层体系（P1-1，2026-09-23）：
#   默认（无参）          → 快速回归层：`-m "not integration"`，约 0.3s（单元 + respx 纯 mock）
#   全量/集成层           → pytest -m integration（TestClient 全链路，约 7-8 分钟）
#   make test             → 全量（保持原语义）
#   make test-fast        → 快速层
addopts =
    -v
    --strict-markers
    --tb=short
    -m "not integration"
    --cov=core
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=0

# 标记
markers =
    unit: 单元测试（纯函数/纯 mock，毫秒级，快速回归层）
    fast: 快速层别名（等价 not integration）
    integration: 集成测试（TestClient 全链路 / 真实中间件栈，分钟级）
    e2e: 端到端测试
    slow: 慢速测试
    api: API 测试
    db: 数据库测试

# 最小版本
minversion = 7.0

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 测试覆盖率配置
[coverage:run]
source = core
omit =
    */tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

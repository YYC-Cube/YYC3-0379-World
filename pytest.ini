[pytest]
# pytest 配置文件

# 测试路径
testpaths = tests

# Python 文件和类的命名模式
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 命令行参数
# 分层体系（P1-1，2026-09-23；2026-10-11 P2-1 密闭化修订实测口径）：
#   默认（无参）          → 快速回归层：`-m "not integration"`，本机 ~5s（fakeredis 后实测）
#   全量/集成层           → pytest -m integration（TestClient 全链路，本机 ~32s；
#                          CI 用真 Redis，历史口径 7-8 分钟主要来自连接重试）
#   make test             → 全量（保持原语义）
#   make test-fast        → 快速层
addopts =
    -v
    --strict-markers
    --tb=short
    -m "not integration"
    --cov=core
    --cov-report=term-missing
    --cov-report=html:htmlcov
    # 覆盖率门禁（2026-10-11 审计修复）：此前为 0（形同虚设）。现按快速层实测
    # 48.6% 设 47——留 ~1.5% 余量吸收 CI(3.11)/本机(3.12) 环境差；剩余盲区为
    # chat/proxy/agent/mcp 等集成重模块（由 integration 层 --cov-append 覆盖），
    # 待 FakeRedis 密闭化后合并口径再继续上调。
    --cov-fail-under=47

# 标记
markers =
    unit: 单元测试（纯函数/纯 mock，毫秒级，快速回归层）
    fast: 快速层别名（等价 not integration）
    integration: 集成测试（TestClient 全链路 / 真实中间件栈，分钟级）
    e2e: 端到端测试
    slow: 慢速测试
    api: API 测试
    db: 数据库测试

# 最小版本
minversion = 7.0

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 测试覆盖率配置
[coverage:run]
source = core
omit =
    */tests/*
    */__pycache__/*
    */migrations/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

[coverage:html]
directory = htmlcov

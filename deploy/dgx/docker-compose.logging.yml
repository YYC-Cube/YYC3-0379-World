# YYC³ DGX 节点日志外送（05 Runbook §2.4）
# 用法（节点侧，yyc3-101 先试点；yyc3-102 换 NODE_ID）：
#   NODE_ID=yyc3-101 NODE_LOKI_HOST=100.65.172.88 NODE_LOKI_PORT=3100 \
#     docker compose -f docker-compose.logging.yml up -d
# 说明：host 网络直连 NAS Tailscale IP；只读挂载容器日志目录，零侵入采集。
services:
  fluent-bit:
    image: docker.m.daocloud.io/fluent/fluent-bit:3.1
    container_name: yyc3-fluent-bit
    restart: unless-stopped
    environment:
      - NODE_ID=${NODE_ID:-yyc3-101}
      - NODE_LOKI_HOST=${NODE_LOKI_HOST:-100.65.172.88}
      - NODE_LOKI_PORT=${NODE_LOKI_PORT:-3100}
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./cn.lua:/fluent-bit/etc/cn.lua:ro # container_id 提取（§2.4 容器标签增强）
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    network_mode: host

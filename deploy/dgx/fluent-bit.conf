# YYC³ DGX 节点容器日志外送（05 Runbook §2.4 · 2026-10-05 试点 n1）
# 链路：docker json-file 日志 → fluent-bit tail → Tailscale → NAS Loki(100.65.172.88:3100)
# 部署：deploy/dgx/docker-compose.logging.yml（NODE_HOST 变量注入本机标识）
[SERVICE]
    Flush          5
    Daemon         Off
    Log_Level      info
    Parsers_File   /fluent-bit/etc/parsers.conf

[INPUT]
    Name           tail
    Path           /var/lib/docker/containers/*/*.log
    Exclude_Path   *.tmp
    Parser         docker
    Tag            yyc3.*
    Path_Key       _src
    Mem_Buf_Limit  50MB
    Skip_Long_Lines On
    Refresh_Interval 10

[FILTER]
    Name          lua
    Match         *
    script        /fluent-bit/etc/cn.lua
    call          extract

[OUTPUT]
    Name    loki
    Match   *
    Host    ${NODE_LOKI_HOST}
    Port    ${NODE_LOKI_PORT}
    Labels  job=dgx-containers,host=${NODE_ID}
    Label_Keys $container_name
    Remove_Keys _src
    Line_Format json

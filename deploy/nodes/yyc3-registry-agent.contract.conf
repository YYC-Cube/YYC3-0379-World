# file: yyc3-registry-agent.contract.conf
# description: 注册 Agent 契约端点 drop-in 模板 - 实例级启用 /v1/model/{metadata,capabilities,health}
# author: YanYuCloudCube Team <admin@0379.email>
# version: v1.0.0
# created: 2026-09-29
# status: active
# tags: [systemd],[registry-agent],[contract],[nodes]
# spec: docs/模型接入与注册/02-Registry目标架构.md §2 / docs/0379-world-yyc3-expert-20260925/17-*.md

# 安装（按实例；端口规划见下表，勿混用）：
#   sudo mkdir -p /etc/systemd/system/yyc3-registry-agent@<model>.service.d
#   替换 <model> 与 <port> 后 tee 到 .../contract.conf
#   sudo systemctl daemon-reload && sudo systemctl restart yyc3-registry-agent@<model>
#
# 端口规划（节点内唯一，全网关可达走 tailscale）：
#   yyc3-102: qwen3-asr-1.7b=9101  minicpm-v-4.6=9102
#   yyc3-101: deepseek-v4-flash=9103  qwen3-embedding-0.6b=9104  qwen3-reranker-0.6b=9105
#
# 验收：curl :<port>/v1/model/capabilities → {"model_id":"<model>","capabilities":[...]}

[Service]
# drop-in 覆写 ExecStart 必须先置空再重声明（systemd 语义）
ExecStart=
ExecStart=/usr/bin/python3 /opt/yyc3-registry-agent/model_register_agent.py \
    --gateway http://100.65.172.88:8000 \
    --meta /opt/yyc3-registry-agent/meta-<model>.json \
    --interval 30 \
    --contract-port <port>

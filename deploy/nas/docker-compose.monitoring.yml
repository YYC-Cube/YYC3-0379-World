# file: docker-compose.monitoring.yml
# description: 观测栈（行动清单 #8 收口）——Prometheus 抓取网关 /metrics + Grafana 面板（NAS :3000 LAN）
# author: YanYuCloudCube Team | version: v1.1.0 | created: 2026-09-24
#
# ⚠️ TOS 实勘（09-24）：/Volume2 工作树文件被 TOS 自动回写 POSIX ACL，容器内非 root uid
# 读取 bind mount 一律 Permission Denied（chmod -N 无效）。故全部改 named volume +
# 部署后 seeding（脚本：deploy/nas/seed-monitoring.sh，容器内 root 复制+chmod）。
#
# 用法（NAS 工作树 /Volume2/yyc3-33，.env 需 GRAFANA_ADMIN_PASSWORD）：
#   $D compose --project-directory . -f deploy/nas/docker-compose.monitoring.yml up -d
#   bash deploy/nas/seed-monitoring.sh   # 首次部署后执行一次
services:
  prometheus:
    image: docker.m.daocloud.io/prom/prometheus:v2.53.0
    container_name: yyc3-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - prometheus-conf:/etc/prometheus
      - prometheus-data:/prometheus
    networks:
      - yyc3-network

  grafana:
    image: docker.m.daocloud.io/grafana/grafana:11.1.0
    container_name: yyc3-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-provisioning:/etc/grafana/provisioning
      - grafana-dashboards:/etc/grafana/dashboards
      - grafana-data:/var/lib/grafana
    ports:
      # 2026-09-26 安全收紧：仅绑 LAN + Tailscale IP，公网不可直连
      - "192.168.3.45:3000:3000"
      - "100.65.172.88:3000:3000"
    networks:
      - yyc3-network
    depends_on:
      - prometheus

  # A2A 审计流 Loki（Phase 5 灰度）：named volume 持久
  # 网关 A2A_AUDIT_LOKI_ENABLED=true → LOKI_URL=http://yyc3-loki:3100 推送
  # 2026-10-05 日志外送（05 Runbook §2.4）：Tailscale 端口收 DGX fluent-bit 推流；
  # 自定义 config（30 天保留 + compactor 清理）见同目录 loki-config.yaml
  loki:
    image: docker.m.daocloud.io/grafana/loki:2.9.2
    container_name: yyc3-loki
    restart: unless-stopped
    user: "0" # NAS ACL 拒绝 UID10001 读 bind-mount 配置；单机灰度栈 + 仅 Tailscale 暴露，root 运行权衡可接受
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - loki-data:/tmp/loki
      # 2026-10-06 修复：原相对路径 ./loki-config.yaml 在 --project-directory 指工作树根时
      # 解析错位（源不存在 → Docker 自动建同名目录挂载 → "config is a directory" 崩溃环）；
      # NAS 专用栈锚定绝对路径（与 rebuild-gateway/seed 等脚本同惯例）
      - /Volume2/yyc3-33/deploy/nas/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      # 仅绑 Tailscale IP（与 grafana 同安全模式，公网不可直连）
      - "100.65.172.88:3100:3100"
    networks:
      - yyc3-network

  # O-1 整改（2026-10-05 终审）：告警通知通道。Prometheus alerting 段指向 alertmanager:9093；
  # 配置经 seed-monitoring.sh 播种进 named volume（同 prometheus 模式，绕 TOS ACL）
  alertmanager:
    image: docker.m.daocloud.io/prom/alertmanager:v0.27.0
    container_name: yyc3-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
    volumes:
      - alertmanager-conf:/etc/alertmanager
      - alertmanager-data:/alertmanager
    networks:
      - yyc3-network

volumes:
  prometheus-conf:
  prometheus-data:
  grafana-provisioning:
  grafana-dashboards:
  grafana-data:
  loki-data:
  alertmanager-conf:
  alertmanager-data:

networks:
  yyc3-network:
    external: true
    name: yyc3-33_yyc3-network # NAS compose 项目前缀实名（docker network ls 实勘）

# @file: docker-compose.nas.yml
# @description: YYC³ NAS 网关部署模板（.env 变量化，无硬编码凭据）
# @usage: 由 scripts/deploy-nas-gateway.sh 自动同步为 /Volume2/yyc3-33/docker-compose.yml
# @note: 所有凭据从同目录 .env 读取；DB_HOST/REDIS_HOST 使用服务名走容器网络直连
version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: 0379-world-postgres-1
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-yyc3_gpt}
    volumes:
      - ./postgres/pgdata:/var/lib/postgresql/data
    # 宿主 5432 被 PG13(媒体)/PG14 占用，PG15 走容器网络内 5432（Gateway 服务名直连）
    restart: unless-stopped
    networks:
      - yyc3-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: 0379-world-redis-1
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis:/data
    # 宿主 6379 被 TOS Redis 占用，Redis 走容器网络内 6379（Gateway 服务名直连）
    restart: unless-stopped
    networks:
      - yyc3-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: .
    container_name: 0379-world-gateway-1
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - API_KEYS=${API_KEYS}
      # ── 管理面密钥分离（P2-6）：空值回退 VALID_API_KEYS；配置后与业务 Key 互斥 ──
      - ADMIN_API_KEYS=${ADMIN_API_KEYS:-}
      - HOST_IP=${HOST_IP:-10.200.0.4}
      - HOST_IP_SUFFIX=${HOST_IP_SUFFIX:-4}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-yyc3_gpt}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      # ── A线上游池（OPENAI_COMPATIBLE_UPSTREAMS 单行 JSON）──
      - ROUTER_ENABLED=${ROUTER_ENABLED:-true}
      - OPENAI_COMPATIBLE_UPSTREAMS=${OPENAI_COMPATIBLE_UPSTREAMS:-[]}
      - OLLAMA_HOST=${OLLAMA_HOST:-host.docker.internal}
      - OLLAMA_BACKUP_HOST=${OLLAMA_BACKUP_HOST:-}
      - ZHIPU_BASE_URL=${ZHIPU_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # ── 第五能力视频任务（Phase 2.3）：结果归档目录（NAS 卷直写，runner 免 ssh）──
      - VIDEO_ARCHIVE_DIR=${VIDEO_ARCHIVE_DIR:-/data/video_archive}
      # ── A2A 协同事务全套（Phase 5 灰度开闸）：协议/结果流消费端/审计 Loki shipper ──
      - A2A_ENABLED=${A2A_ENABLED:-true}
      - A2A_RESULT_CONSUMER_ENABLED=${A2A_RESULT_CONSUMER_ENABLED:-true}
      - A2A_AUDIT_LOKI_ENABLED=${A2A_AUDIT_LOKI_ENABLED:-true}
      - LOKI_URL=${LOKI_URL:-http://yyc3-loki:3100}
    ports:
      - "8000:8000"
    volumes:
      - /Volume1/yyc3_hd/video_tasks:/data/video_archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - yyc3-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── A2A 业务 Agent Worker（5 编队独立进程；与网关同镜像不同入口）──
  # 容器语义：SIGTERM 即退，在途消息留 PEL 由 XAUTOCLAIM 回收（无丢失）
  agent-worker:
    build: .
    container_name: 0379-world-worker-1
    command: ["python", "-m", "app.worker_entry"]
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-yyc3_gpt}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      # 5 Agent 编队（缺省全量：语枢/预见/创想/格物/演启）；缩编改 A2A_WORKER_AGENTS
      - A2A_WORKER_AGENTS=${A2A_WORKER_AGENTS:-yushu-wanwu-001,yujian-xianzhi-001,chuangxiang-lingyun-001,gewu-zongshi-001,yanqi-qianhang-001}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - yyc3-network

  # ── A2A 编排器独立位（可选；profiles 隔离默认不起）──
  # 启用：docker compose --profile orchestrator up -d orchestrator
  # 独立形态：网关侧 A2A_RESULT_CONSUMER_ENABLED=false；混合形态双开安全（组分摊）
  orchestrator:
    build: .
    container_name: 0379-world-orchestrator-1
    command: ["python", "-m", "app.orchestrator_entry"]
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-yyc3_gpt}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - yyc3-network
    profiles:
      - orchestrator

networks:
  yyc3-network:
    driver: bridge

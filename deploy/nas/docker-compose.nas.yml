# @file: docker-compose.nas.yml
# @description: YYC³ NAS 网关部署模板（.env 变量化，无硬编码凭据）
# @usage: 由 scripts/deploy-nas-gateway.sh 自动同步为 /Volume2/yyc3-33/docker-compose.yml
# @note: 所有凭据从同目录 .env 读取；DB_HOST/REDIS_HOST 使用服务名走容器网络直连
version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: 0379-world-postgres-1
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-yyc3_gpt}
    volumes:
      - ./postgres/pgdata:/var/lib/postgresql/data
    # 宿主 5432 被 PG13(媒体)/PG14 占用，PG15 走容器网络内 5432（Gateway 服务名直连）
    restart: unless-stopped
    networks:
      - yyc3-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: 0379-world-redis-1
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis:/data
    # 宿主 6379 被 TOS Redis 占用，Redis 走容器网络内 6379（Gateway 服务名直连）
    restart: unless-stopped
    networks:
      - yyc3-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: .
    container_name: 0379-world-gateway-1
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - API_KEYS=${API_KEYS}
      - HOST_IP=${HOST_IP:-10.200.0.4}
      - HOST_IP_SUFFIX=${HOST_IP_SUFFIX:-4}
      - DB_HOST=postgres
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-yyc3_gpt}
      - REDIS_HOST=redis
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - yyc3-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  yyc3-network:
    driver: bridge
